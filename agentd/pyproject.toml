[project]
name = "agentd"
version = "0.1.0"
description = "PetOS agent runtime: manager + read-only worker agents over a local WebSocket."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
keychain = ["keyring>=25.0"]

[project.scripts]
agentd = "agentd.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
